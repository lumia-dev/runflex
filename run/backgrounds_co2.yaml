laptop :
  paths : 
    build : build
    run : run
    src : ${runflex:src/flexpart10.4}
    extras : ${runflex:src/dev}
    makefile : makefile.ubuntu.gfortran
    output : output
    logfile : ${paths.run}/flexpart.out
    command : ${file:COMMAND}
    meteo : /scratch/FLEXPART/meteo

donkey :
  paths :
    build : /data/users/Kristian/flexpart/build
    run : /data/users/Kristian/run
    src : ${runflex:src/flexpart10.4}
    extras : ${runflex:src/satflex} #use satflex
    makefile : makefile.opensuse-tumbleweed.gfortran
    output : /data/users/Kristian/output
    logfile : ${paths.run}/flexpart.out
    command : ${runflex:inputs/COMMAND}
    meteo : /data/users/Kristian/meteo
  ncpus : 16
  obs_per_task : 500

run :
  logfile : ${host.paths.logfile}
  serial : no
  ncpus : ${host.ncpus}
  obs_per_task : ${host.obs_per_task}

paths : ${host.paths}

