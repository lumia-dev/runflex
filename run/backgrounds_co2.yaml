observations :
  coordinates :
    Hyltemossa :
      lat : 56.1
      lon : 13.42
      height : 115
      alt : 150
      #Kristian april 2024:
      #Ak_levels : start by making som manual levels here
      #AkPW : and weights here
      levels: [50, 100, 150]
      weights: [1, 1, 1]
    "*" :
      start : 1 february 2018
      end : 3 february 2018
      freq : 1H
      range : from 12:00 to 18:00
      
  release :
    kindz :
      threshold : 1000

outgrid :
  x : [-15, 35, 0.25]    # [lon_min, lon_max, lon_step]
  y : [33, 73, 0.25]     # [lat_min, lat_max, lat_step]
  levels : [100]        # Height of the surface layer

releases :
  length : 14
  species : 
    species : AIRTRACER
    weightmolar : 29

  mass : ${.npart}
  npart : 10_000
  dt_max : 180D

meteo :
  archive : ${rclone:swestore:FLEXPART/meteo/ea.eurocom025x025}
  prefix : EA
  interv : 1h
  logfile : meteo.log

postprocess :
  lumia : yes

flexpart :
  npartmax : 5_000_000

command :
  loutsample : 300 # should be < lsynctime + should be smaller than grid size / ABL wind speed ==> not sure if it makes anything with footprints ...
  lsynctime : 300
  ctl : 3
  ifine : 4
  cblflag : 0   # should stay at 0
  lsubgrid : 1
  lconvection : 1
  ind_source : 1
  ind_receptor : 2
  loutaver : 3600
  loutstep : 3600